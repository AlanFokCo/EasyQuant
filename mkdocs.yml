site_name: EasyQuant
site_description: EasyQuant / eqlib — 中国 A 股事件驱动回测框架
site_url: https://AlanFokCo.github.io/EasyQuant
repo_url: https://github.com/AlanFokCo/EasyQuant
repo_name: AlanFokCo/EasyQuant
docs_dir: docs
copyright: Copyright &copy; AlanFokCo · MIT License
theme:
  name: material
  logo: assets/logo-icon.svg
  favicon: assets/logo-icon.svg
  language: zh
  font:
    text: "Noto Sans SC"
    code: "JetBrains Mono"
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.tooltips
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换浅色模式
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换深色模式
extra:
  homepage: https://AlanFokCo.github.io/EasyQuant
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AlanFokCo/EasyQuant
      name: GitHub
extra_css:
  - assets/stylesheets/extra.css
plugins:
  - search:
      lang:
        - zh
        - en
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
      enable_parallel_processing: false
markdown_extensions:
  - admonition
  - attr_list
  - codehilite
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.betterem
  - pymdownx.smartsymbols
  - def_list
nav:
  - Home: index.md

  - 快速入门:
      - 文档中心: doc/README.md
      - 环境与第一次运行: tutorials/00_environment_and_first_run.md

  - 用户手册:
      - 用户手册: doc/user_guide.md
      - PTrade/QMT 实盘适配: doc/ptrade_adapter.md
      - 常见问题: doc/FAQ.md

  - API 参考:
      - API 参考: doc/api_reference.md
      - 工具库参考: doc/utils_reference.md
      - 报告与指标: doc/reports_and_metrics.md

  - 教程:
      - 教程导读: tutorials/README.md
      - 前置知识:
          - 总览: tutorials/prerequisites/README.md
          - Python 基础: tutorials/prerequisites/python_basics.md
          - 技术分析: tutorials/prerequisites/technical_concepts.md
          - A 股市场: tutorials/prerequisites/ashare_knowledge.md
      - "00 · 环境与第一次运行": tutorials/00_environment_and_first_run.md
      - "01 · 量化基础": tutorials/01_quant_basics.md
      - "02 · 首个策略": tutorials/02_first_strategy.md
      - "03 · 回测入门": tutorials/03_backtesting.md
      - "04 · 策略优化": tutorials/04_strategy_optimization.md
      - "05 · 模拟盘与实盘": tutorials/05_live_trading.md
      - "06 · RSI 均值回归": tutorials/06_rsi_mean_reversion.md
      - "07 · 行业轮动": tutorials/07_sector_rotation.md
      - "08 · 多因子选股": tutorials/08_multi_factor.md
      - "09 · 综合策略": tutorials/09_combined_strategy.md
      - "10 · 参数优化与审计": tutorials/10_agent_optimization.md

  - 示例:
      - 示例索引: examples/Examples.md

  - 词汇表: glossary.md

  - 项目:
      - 更新日志: CHANGELOG.md
      - 贡献指南: CONTRIBUTING.md
      - 安全政策: SECURITY.md

  - GitHub: https://github.com/AlanFokCo/EasyQuant
