# Preset users configuration
# These users will be automatically created on server startup.
#
# Format:
#   - username: <username>
#     password: <password>
#
# Example:
#   preset_users:
#     - username: demo
#       password: ***REMOVED***
#     - username: analyst
#       password: ***REMOVED***
#
# You can also configure via environment variable EQ_PRESET_USERS:
#   EQ_PRESET_USERS="demo:***REMOVED***,analyst:***REMOVED***"
#
# If both are configured, both sets of users will be created.

preset_users:
  # Default demo user (remove or modify as needed)
  - username: demo
    password: ***REMOVED***

  # Add more users below:
  # - username: quant
  #   password: ***REMOVED***
  # - username: researcher
  #   password: ***REMOVED***