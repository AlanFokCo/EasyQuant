# Preset users configuration
# These users will be automatically created on server startup.
#
# Format:
#   preset_users:
#     - username: <username>
#       password: <strong-unique-password>
#
# SECURITY: never commit real credentials to git. Prefer the
# EQ_PRESET_USERS environment variable on the server instead:
#   EQ_PRESET_USERS="user1:<strong-password>,user2:<strong-password>"
#
# If both are configured, both sets of users will be created.

preset_users: []
