[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eq-studio-api"
version = "0.1.1"
description = "EasyQuant Web Strategy Studio — FastAPI backend"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.19.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "ruff>=0.3.0",
    "black>=24.0.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["studio_api*"]

[tool.setuptools.package-data]
studio_api = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
