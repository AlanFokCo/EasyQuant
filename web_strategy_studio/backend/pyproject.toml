[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eq-studio-api"
version = "0.1.1"
description = "EasyQuant Web Strategy Studio — FastAPI backend"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.19.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "structlog>=24.1.0",
    "slowapi>=0.1.9",
    "alembic>=1.13.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=7.0", "pytest-asyncio>=0.23.0", "mypy>=1.9.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["studio_api*"]

[tool.setuptools.package-data]
studio_api = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # line-too-long — black handles this
    # Python 3.9 compatibility: keep Optional[T], List[T], Dict[K, V]
    # instead of T | None, list[T], dict[K, V] (3.10+ syntax)
    "UP006",
    "UP035",
    "UP045",
]

[tool.ruff.lint.isort]
known-first-party = ["studio_api"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
# lenient mode — tighten gradually
check_untyped_defs = false
